modbus_request:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: larnitech
    port:
      required: true
      example: "210:1"
      selector:
        text:
    slave:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 247
          mode: box
    function:
      required: true
      example: 3
      selector:
        number:
          min: 3
          max: 16
          mode: box
    address:
      required: true
      example: 6
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      default: 1
      selector:
        number:
          min: 1
          max: 125
          mode: box
    values:
      example: "[35]"
      selector:
        object:
